<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Weekly Quiz - Week 01</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>FRIM WEEKLY QUIZ</h1>
            <p>Week 01</p>
        </header>


        <!-- Plant Image -->
        <section class="plant-section">

            <img 
                src="images/Image_Q1_W1.jpg"
                alt="Clerodendrum paniculatum L. (pokok pagoda)"
                class="plant-image"
            >

        </section>


        <!-- Question -->
        <section class="question-section">

            <h2>
                Which of the following is a traditional use of
                <i>Clerodendrum paniculatum</i> L.?
            </h2>

            <p class="question-description">
                <i>Clerodendrum paniculatum</i> L., also known as
                <strong>pokok pagoda</strong>, has been used in
                traditional medicine in several countries.
            </p>

        </section>


        <!-- Answer Options -->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. To alleviate fever and treat inflammation
            </button>

            <button class="answer-option" data-answer="B">
                B. To improve eyesight
            </button>

            <button class="answer-option" data-answer="C">
                C. To treat toothache
            </button>

            <button class="answer-option" data-answer="D">
                D. To improve digestion
            </button>

        </section>


        <!-- Submit -->
        <section class="submit-section">

            <button id="submit-button">
                SUBMIT
            </button>

        </section>

    </main>


    <script src="js/script.js"></script>

</body>
</html>
