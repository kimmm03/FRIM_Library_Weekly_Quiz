<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Library Weekly Quiz</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
         <header class="quiz-header">
            <h1> FRIM LIBRARY WEEKLY QUIZ</h1>
            <P>Week 01 - Question 2</P>
         </header>
        
        
        <!--Pant Image -->
        <section class="plant-section">

            <img
                src="../images/Image_Q2_W1.jpg"
                alt="Coccinia grandis (L.) Voigt. (timun tikus)"
                class="plant-image"

            >
        
        </section>

        <h2>
            What is the fruit of <i>Coccinia grandis</i> (L.) Voigt.
            traditionally believed to be used for?
        </h2>

        <p class="question-description">
            <i>Coccinia grandis</i> (L.) Voigt., also known as
            <strong>timun tikus</strong><strong>, is a wild climbing plant
            found in Malyasia and other parts of Asia.
        </p>
    
        </section>


        <!-- Answer Options-->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. Fever
            </button>

            <button class="answer-option" data-answer="B">
                B. Diabetes
            </button>

            <button class="answer-option" data-answer="C">
                C. Toothache
            </button>

            <button class="answer-option" data-answer="D">
                D. High blood pressure
            </button>

        </section>

    <!-- Submit -->
    <section class="submit-section">

        <button id="submit-button">
            SUBMIT
        </button>

    </section>

    
    </main>

<script src="../js/script.js"></script>
<script src="../js/button_sound.js"></script>
