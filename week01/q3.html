<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Library Weekly Quiz - Week 01</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="quiz-container">

        <!-- Header -->
        <header class="quiz-header">
            <h1>FRIM WEEKLY QUIZ</h1>
            <p>Week 01</p>
        </header>


        <!-- Plant Image -->
        <section class="plant-section">

            <img 
                src="../images/Image_Q3_W1.jpg"
                alt="Eugeissona tristis Griff. (bertam)"
                class="plant-image"
            >

        </section>


        <!-- Question -->
        <section class="question-section">

            <h2>
                Which part of the bertam
                (<i>Eugeissona tristis</i> Griff.)
                can be used to make roofing?
            </h2>

            <p class="question-description">
                <i>Eugeissona tristis</i> Griff., also known as
                <strong>bertam</strong>, is a wild palm commonly
                found in the forests of Malaysia and Thailand.
            </p>

        </section>


        <!-- Answer Options -->
        <section class="answer-section">

            <button class="answer-option" data-answer="A">
                A. The leaves
            </button>

            <button class="answer-option" data-answer="B">
                B. The roots
            </button>

            <button class="answer-option" data-answer="C">
                C. The flowers
            </button>

            <button class="answer-option" data-answer="D">
                D. The fruits
            </button>

        </section>


        <!-- Submit -->
        <section class="submit-section">

            <button id="submit-button">
                SUBMIT
            </button>

        </section>

    </main>


<script src="../js/script.js"></script>
<script src="../js/button_sound.js"></script>
</body>
</html>
